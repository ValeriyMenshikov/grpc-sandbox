[project]
name = "gateway"
version = "0.1.0"
description = "gateway: REST-шлюз (BFF) для веб-фронта поверх gRPC-сервисов стенда"
requires-python = ">=3.12"
dependencies = ["stand-core", "stand-protos", "fastapi>=0.115", "uvicorn>=0.32"]

[tool.uv.sources]
stand-core = { workspace = true }
stand-protos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

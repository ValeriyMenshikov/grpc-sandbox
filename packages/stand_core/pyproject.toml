[project]
name = "stand-core"
version = "0.1.0"
description = "Общая библиотека стенда: rpc, grpc_server, интерцепторы, клиенты"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "googleapis-common-protos>=1.66",
    "grpcio>=1.66",
    "grpcio-health-checking>=1.66",
    "grpcio-reflection>=1.66",
    "grpcio-status>=1.66",
    "nuke-di>=2.0,<3",
    "protobuf>=5.28",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stand_core"]

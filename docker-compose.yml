# Базовый набор стенда. Тяжёлые компоненты в будущем — только через profiles.
name: grpc-stand

x-restart: &restart
  restart: unless-stopped

# Один образ на все Python-сервисы (docker/Dockerfile); сервис выбирается командой
x-python-service: &python-service
  <<: *restart
  image: grpc-stand-python:${PYTHON_VERSION:-3.12}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
  mem_limit: 128m

# Переменные, общие для всех Python-сервисов; значения по умолчанию — как в .env.example
x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  STAND_API_KEY: ${STAND_API_KEY:-stand-secret-key}
  SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-5}
  CONNECT_TIMEOUT_SECONDS: ${CONNECT_TIMEOUT_SECONDS:-10}
  GRPC_DEFAULT_DEADLINE_SECONDS: ${GRPC_DEFAULT_DEADLINE_SECONDS:-5}
  POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://stand:stand@postgres:5432/stand}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

# Healthcheck gRPC-сервиса через стандартный health service (адрес — localhost:$GRPC_PORT)
x-grpc-healthcheck: &grpc-healthcheck
  test: ["CMD", "python", "-m", "stand_core.grpc.healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stand}
      POSTGRES_DB: ${POSTGRES_DB:-stand}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Брокер событий: users публикует, notifications потребляет (без management-плагина)
  rabbitmq:
    <<: *restart
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stand}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stand}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
    mem_limit: 256m
    # Брокер стартует медленно — start_period с запасом
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Почтовый ящик стенда: SMTP 1025, веб-ящик и REST API на 8025 под /mail (для прокси фронта);
  # письма — в памяти, volume не нужен
  mailpit:
    <<: *restart
    image: axllent/mailpit
    environment:
      MP_WEBROOT: /mail
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    mem_limit: 64m
    # Встроенная проверка /readyz, без curl (его в образе нет)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  users:
    <<: *python-service
    command: ["python", "-m", "user_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50051
      SESSION_TTL_S: ${SESSION_TTL_S:-3600}
      CONFIRM_CODE_TTL_S: ${CONFIRM_CODE_TTL_S:-900}
      CONFIRM_PUBLISH_TIMEOUT_S: ${CONFIRM_PUBLISH_TIMEOUT_S:-2}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://stand:stand@rabbitmq:5672/}
      SEED_SELLER_PASSWORD: ${SEED_SELLER_PASSWORD:-seller-password}
    ports:
      - "${USERS_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — коды подтверждения confirm:{email} и сессии session:{token}
      redis:
        condition: service_healthy
      # Только порядок старта: без брокера позже SignUp проходит, но письма нет
      rabbitmq:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  catalog:
    <<: *python-service
    command: ["python", "-m", "catalog_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50052
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-10000}
      STOCK_RESERVE_DELAY_MS: ${STOCK_RESERVE_DELAY_MS:-0}
    ports:
      - "${CATALOG_PORT:-50052}:50052"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — для сессий пользователей в AuthInterceptor
      redis:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  orders:
    <<: *python-service
    command: ["python", "-m", "order_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50053
      CATALOG_ADDR: ${CATALOG_ADDR:-catalog:50052}
      IDEMPOTENCY_TTL_S: ${IDEMPOTENCY_TTL_S:-86400}
      FULFILLMENT_STEP_MS: ${FULFILLMENT_STEP_MS:-2000}
    ports:
      - "${ORDERS_PORT:-50053}:50053"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — сессии, корзины cart:{user_id}, ключи идемпотентности idem:{user_id}:{key}
      # и pub/sub смен статуса orders.status.{order_id}
      redis:
        condition: service_healthy
      # Только порядок старта: остановленный позже catalog даёт UNAVAILABLE у Checkout
      catalog:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  support:
    <<: *python-service
    command: ["python", "-m", "support_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50054
      ORDERS_ADDR: ${ORDERS_ADDR:-orders:50053}
      SUPPORT_AGENT_DELAY_MS: ${SUPPORT_AGENT_DELAY_MS:-1500}
      SUPPORT_IDLE_TIMEOUT_S: ${SUPPORT_IDLE_TIMEOUT_S:-60}
    ports:
      - "${SUPPORT_PORT:-50054}:50054"
    depends_on:
      # Postgres — чаты и сообщения (схема support)
      postgres:
        condition: service_healthy
      # Redis — для сессий пользователей в AuthInterceptor
      redis:
        condition: service_healthy
      # Только порядок старта: остановленный позже orders даёт боту «Не удалось получить статус»
      orders:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  notifications:
    <<: *python-service
    command: ["python", "-m", "notification_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50055
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://stand:stand@rabbitmq:5672/}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-Маркетплейс-стенд <noreply@stand.local>}
    ports:
      - "${NOTIFICATIONS_PORT:-50055}:50055"
    depends_on:
      # Postgres — журнал писем (схема notifications)
      postgres:
        condition: service_healthy
      # Redis — для сессий пользователей в AuthInterceptor
      redis:
        condition: service_healthy
      # RabbitMQ — очередь писем notifications.email из exchange stand.events
      rabbitmq:
        condition: service_healthy
      # Только порядок старта: остановленный позже Mailpit — письма в dead-letter со статусом FAILED
      mailpit:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  gateway:
    <<: *python-service
    command: ["python", "-m", "gateway.main"]
    environment:
      <<: *common-env
      HTTP_PORT: 8080
      USERS_ADDR: ${USERS_ADDR:-users:50051}
      CATALOG_ADDR: ${CATALOG_ADDR:-catalog:50052}
      ORDERS_ADDR: ${ORDERS_ADDR:-orders:50053}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      # Только порядок старта: остановленный позже сервис даёт 503 у его эндпоинтов
      users:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    # HTTP GET /healthz из Python-скрипта в образе, без curl
    healthcheck:
      test: ["CMD", "python", "-m", "gateway.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    <<: *restart
    build:
      context: ./frontend
    mem_limit: 128m
    environment:
      # nginx проксирует /api/* на этот адрес, префикс /api срезается
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      # nginx проксирует /mail/* на этот адрес без срезания префикса (у Mailpit MP_WEBROOT=/mail)
      MAILPIT_URL: ${MAILPIT_URL:-http://mailpit:8025}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      # Только порядок старта: остановленный позже gateway даёт 502 у /api, SPA отдаётся
      gateway:
        condition: service_healthy
    # Собственный /healthz nginx через busybox wget, не зависит от gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

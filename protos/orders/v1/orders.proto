syntax = "proto3";

package orders.v1;

import "common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// Корзина, оформление заказа, заказы и отслеживание доставки. Порт 50053. Все методы — Auth: user.
service OrderService {
  // Корзина в Redis cart:{user_id}. Товар не найден → NOT_FOUND.
  rpc AddCartItem(AddCartItemRequest) returns (AddCartItemResponse);
  rpc RemoveCartItem(RemoveCartItemRequest) returns (RemoveCartItemResponse);
  // Актуальные цены и остатки — из catalog-service.
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  // Metadata idempotency-key обязательна. Резерв через StockService.ReserveStock.
  rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
  // Чужой заказ → NOT_FOUND.
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  // Новые первыми, фильтр по статусу, пагинация.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  // Можно до ORDER_STATUS_HANDED_TO_COURIER, иначе FAILED_PRECONDITION.
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // Server stream: текущий статус, затем каждое изменение. Закрывается после DELIVERED/CANCELLED,
  // trailing metadata x-items-count.
  rpc TrackOrder(TrackOrderRequest) returns (stream TrackOrderResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_ASSEMBLING = 3;
  ORDER_STATUS_HANDED_TO_COURIER = 4;
  ORDER_STATUS_DELIVERED = 5;
  ORDER_STATUS_CANCELLED = 6;
}

message CartItem {
  string product_id = 1;
  string name = 2;
  int64 quantity = 3;
  common.v1.Money unit_price = 4;
  // Доступный остаток в catalog-service на момент запроса.
  int64 available = 5;
}

message Cart {
  repeated CartItem items = 1;
  common.v1.Money total = 2;
}

message AddCartItemRequest {
  string product_id = 1;
  // Сколько добавить к уже лежащему в корзине; больше 0.
  int64 quantity = 2;
}

message AddCartItemResponse {
  Cart cart = 1;
}

message RemoveCartItemRequest {
  string product_id = 1;
}

message RemoveCartItemResponse {
  Cart cart = 1;
}

message GetCartRequest {}

message GetCartResponse {
  Cart cart = 1;
}

message OrderItem {
  string product_id = 1;
  string name = 2;
  int64 quantity = 3;
  common.v1.Money unit_price = 4;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  OrderStatus status = 3;
  repeated OrderItem items = 4;
  common.v1.Money total = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CheckoutRequest {}

message CheckoutResponse {
  Order order = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  // Не задано — все статусы.
  optional OrderStatus status = 1;
  common.v1.Pagination pagination = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message CancelOrderResponse {
  Order order = 1;
}

message TrackOrderRequest {
  string order_id = 1;
}

message TrackOrderResponse {
  string order_id = 1;
  OrderStatus status = 2;
  google.protobuf.Timestamp changed_at = 3;
}

syntax = "proto3";

package common.v1;

// Денежная сумма в стиле google.type.Money.
// Сумма = units + nanos / 1e9. Для рублей: 199.90 RUB = {units: 199, nanos: 900000000}.
message Money {
  // Трёхбуквенный код валюты ISO 4217, например "RUB".
  string currency_code = 1;
  // Целая часть суммы.
  int64 units = 2;
  // Дробная часть в нано-единицах, от -999 999 999 до 999 999 999, знак совпадает с units.
  int32 nanos = 3;
}

// Параметры страницы для списочных методов.
// В ответе списочного метода есть next_page_token; пустой токен — последняя страница.
message Pagination {
  // Размер страницы. 0 — размер по умолчанию на стороне сервиса.
  int32 page_size = 1;
  // Непрозрачный токен из next_page_token предыдущего ответа. Пусто — первая страница.
  string page_token = 2;
}

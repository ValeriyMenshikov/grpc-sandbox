[project]
name = "order-service"
version = "0.1.0"
description = "order-service: корзина, оформление заказа, заказы и отслеживание доставки"
requires-python = ">=3.12"
dependencies = ["stand-core", "stand-protos"]

[tool.uv.sources]
stand-core = { workspace = true }
stand-protos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]

[project]
name = "notifications-service"
version = "0.1.0"
description = "notification-service: письма по событиям из RabbitMQ (SMTP → Mailpit) и их журнал"
requires-python = ">=3.12"
dependencies = ["stand-core", "stand-protos", "aiosmtplib>=3"]

[tool.uv.sources]
stand-core = { workspace = true }
stand-protos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

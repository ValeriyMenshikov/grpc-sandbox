# Базовый набор стенда. Тяжёлые компоненты в будущем — только через profiles.
name: grpc-stand

x-restart: &restart
  restart: unless-stopped

# Один образ на все Python-сервисы (docker/Dockerfile); сервис выбирается командой
x-python-service: &python-service
  <<: *restart
  image: grpc-stand-python:${PYTHON_VERSION:-3.12}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
  mem_limit: 128m

# Переменные, общие для всех Python-сервисов; значения по умолчанию — как в .env.example
x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  STAND_API_KEY: ${STAND_API_KEY:-stand-secret-key}
  SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-5}
  CONNECT_TIMEOUT_SECONDS: ${CONNECT_TIMEOUT_SECONDS:-10}
  GRPC_DEFAULT_DEADLINE_SECONDS: ${GRPC_DEFAULT_DEADLINE_SECONDS:-5}
  POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://stand:stand@postgres:5432/stand}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

# Healthcheck gRPC-сервиса через стандартный health service (адрес — localhost:$GRPC_PORT)
x-grpc-healthcheck: &grpc-healthcheck
  test: ["CMD", "python", "-m", "stand_core.grpc.healthcheck"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 10s

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stand}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stand}
      POSTGRES_DB: ${POSTGRES_DB:-stand}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  users:
    <<: *python-service
    command: ["python", "-m", "user_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50051
      SESSION_TTL_S: ${SESSION_TTL_S:-3600}
      CONFIRM_CODE_TTL_S: ${CONFIRM_CODE_TTL_S:-900}
      SEED_SELLER_PASSWORD: ${SEED_SELLER_PASSWORD:-seller-password}
    ports:
      - "${USERS_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — коды подтверждения confirm:{email} и сессии session:{token}
      redis:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  catalog:
    <<: *python-service
    command: ["python", "-m", "catalog_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50052
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-10000}
      STOCK_RESERVE_DELAY_MS: ${STOCK_RESERVE_DELAY_MS:-0}
    ports:
      - "${CATALOG_PORT:-50052}:50052"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — для сессий пользователей в AuthInterceptor
      redis:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  orders:
    <<: *python-service
    command: ["python", "-m", "order_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50053
      CATALOG_ADDR: ${CATALOG_ADDR:-catalog:50052}
      IDEMPOTENCY_TTL_S: ${IDEMPOTENCY_TTL_S:-86400}
      FULFILLMENT_STEP_MS: ${FULFILLMENT_STEP_MS:-2000}
    ports:
      - "${ORDERS_PORT:-50053}:50053"
    depends_on:
      postgres:
        condition: service_healthy
      # Redis — сессии, корзины cart:{user_id}, ключи идемпотентности idem:{user_id}:{key}
      # и pub/sub смен статуса orders.status.{order_id}
      redis:
        condition: service_healthy
      # Только порядок старта: остановленный позже catalog даёт UNAVAILABLE у Checkout
      catalog:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  support:
    <<: *python-service
    command: ["python", "-m", "support_service.main"]
    environment:
      <<: *common-env
      GRPC_PORT: 50054
      ORDERS_ADDR: ${ORDERS_ADDR:-orders:50053}
      SUPPORT_AGENT_DELAY_MS: ${SUPPORT_AGENT_DELAY_MS:-1500}
      SUPPORT_IDLE_TIMEOUT_S: ${SUPPORT_IDLE_TIMEOUT_S:-60}
    ports:
      - "${SUPPORT_PORT:-50054}:50054"
    depends_on:
      # Postgres — чаты и сообщения (схема support)
      postgres:
        condition: service_healthy
      # Redis — для сессий пользователей в AuthInterceptor
      redis:
        condition: service_healthy
      # Только порядок старта: остановленный позже orders даёт боту «Не удалось получить статус»
      orders:
        condition: service_healthy
    healthcheck: *grpc-healthcheck

  gateway:
    <<: *python-service
    command: ["python", "-m", "gateway.main"]
    environment:
      <<: *common-env
      HTTP_PORT: 8080
      USERS_ADDR: ${USERS_ADDR:-users:50051}
      CATALOG_ADDR: ${CATALOG_ADDR:-catalog:50052}
      ORDERS_ADDR: ${ORDERS_ADDR:-orders:50053}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      # Только порядок старта: остановленный позже сервис даёт 503 у его эндпоинтов
      users:
        condition: service_healthy
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    # HTTP GET /healthz из Python-скрипта в образе, без curl
    healthcheck:
      test: ["CMD", "python", "-m", "gateway.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

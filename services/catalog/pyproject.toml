[project]
name = "catalog-service"
version = "0.1.0"
description = "catalog-service: каталог, поиск, импорт/экспорт товаров продавца, остатки и резервы"
requires-python = ">=3.12"
dependencies = ["stand-core", "stand-protos"]

[tool.uv.sources]
stand-core = { workspace = true }
stand-protos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_service"]

[project]
name = "grpc-stand"
version = "0.1.0"
description = "Учебный gRPC-стенд маркетплейса"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["stand-core", "stand-protos"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "httpx>=0.27",
    "mypy>=1.13",
    "mypy-protobuf>=3.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-grpcio>=1.0",
    "types-protobuf>=5.28",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["gen", "packages/*", "services/*"]

[tool.uv.sources]
stand-core = { workspace = true }
stand-protos = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["nuke_di.mypy"]
exclude = ["^gen/"]
explicit_package_bases = true
mypy_path = ["packages/stand_core/src", "gen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not stand'"
testpaths = ["packages", "services", "tests"]
markers = ["stand: smoke-тесты против поднятого стенда (make up)"]
